name: Build & Release

# Her "v*" tag push'unda tetiklenir (örn: v1.0.1)
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2025

    steps:
      - name: Kaynak kodu çek
        uses: actions/checkout@v5

      - name: Node.js kurulumu
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Bağımlılıkları yükle
        run: npm install

      - name: Güncelleme notlarını doğrula
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if (-not (Test-Path -LiteralPath 'RELEASE_NOTES.md')) {
            throw 'RELEASE_NOTES.md bulunamadı. Açıklamasız sürüm yayınlanamaz.'
          }
          $notes = Get-Content -LiteralPath 'RELEASE_NOTES.md' -Raw
          if ([string]::IsNullOrWhiteSpace($notes) -or $notes -notmatch [regex]::Escape($version)) {
            throw "RELEASE_NOTES.md içinde sürüm $version bulunmalı."
          }

      - name: Windows x64 NSIS installer üret ve GitHub Releases'a yükle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run publish

      - name: Güncelleme notlarını GitHub yayınına ekle
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --notes-file RELEASE_NOTES.md
