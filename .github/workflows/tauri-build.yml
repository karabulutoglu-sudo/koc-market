name: Tauri Build & Release

# "tauri-v*" etiketiyle tetiklenir (örn: tauri-v2.0.0).
# Electron iş akışı (build.yml) "v*" ile çalışır — ikisi birbirine karışmaz.
on:
  push:
    tags:
      - 'tauri-v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tauri-release
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Kaynak kodu çek
        uses: actions/checkout@v5

      - name: Node.js kurulumu
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Sürüm ve yayın hedefini doğrula
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $conf = Get-Content -LiteralPath 'tauri/src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
          $version = $conf.version
          $tag = "tauri-v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne $tag) {
            throw "Etiket ($env:GITHUB_REF_NAME) ile tauri.conf.json sürümü ($version) uyuşmuyor."
          }
          $notes = Get-Content -LiteralPath 'tauri/RELEASE_NOTES.md' -Raw
          if ([string]::IsNullOrWhiteSpace($notes) -or $notes -notmatch [regex]::Escape($version)) {
            throw "tauri/RELEASE_NOTES.md içinde sürüm $version bulunmalı."
          }
          $commit = git rev-parse --verify HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Derlenen commit belirlenemedi.' }
          node tauri/scripts/verify-release-target.mjs $version $commit
          if ($LASTEXITCODE -ne 0) { throw 'Yayın hedefi doğrulanamadı.' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "commit=$commit" >> $env:GITHUB_OUTPUT
          "notes<<NOTLAR_SONU" >> $env:GITHUB_OUTPUT
          $notes >> $env:GITHUB_OUTPUT
          "NOTLAR_SONU" >> $env:GITHUB_OUTPUT

      - name: Rust kurulumu
        uses: dtolnay/rust-toolchain@stable

      - name: Rust önbelleği
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri -> target

      - name: Kökteki JavaScript testleri
        run: npm test

      - name: Bağımlılıkları yükle
        working-directory: tauri
        run: npm ci

      - name: Türkçe karakter aktarımını ve yeniden açılışı doğrula
        working-directory: tauri
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Açılış aktarım testleri başarısız.' }
          npm run test:rust
          if ($LASTEXITCODE -ne 0) { throw 'Rust açılış testleri başarısız.' }
          npm run hazirla
          if ($LASTEXITCODE -ne 0) { throw 'Web preparation failed.' }
          npm run test:pdf
          if ($LASTEXITCODE -ne 0) { throw 'PDF ve CSP testleri başarısız.' }
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib
          if ($LASTEXITCODE -ne 0) { throw 'Repair and backup tests failed.' }

      - name: Tauri NSIS kurulumu üret + GitHub'a yükle (ÖN SÜRÜM olarak)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          projectPath: tauri
          tagName: ${{ steps.meta.outputs.tag }}
          releaseCommitish: ${{ steps.meta.outputs.commit }}
          releaseName: 'Koç Market __VERSION__'
          releaseBody: ${{ steps.meta.outputs.notes }}
          releaseDraft: false
          # ÖN SÜRÜM: marketteki uygulamalar bunu GÖRMEZ. Test ettikten sonra
          # GitHub'da "Set as latest release" yapınca güncelleme dağıtılır.
          prerelease: true
          includeUpdaterJson: true

      - name: Electron → Tauri köprüsü (latest.yml) üret ve yükle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KOC_RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          KOC_RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          $v = $env:KOC_RELEASE_VERSION
          $exe = Get-ChildItem 'tauri/src-tauri/target/release/bundle/nsis/*-setup.exe' | Select-Object -First 1
          if (-not $exe) { throw 'NSIS kurulum dosyası bulunamadı.' }
          node tauri/scripts/electron-kopru.mjs $exe.FullName $v kopru
          if ($LASTEXITCODE -ne 0) { throw 'Electron güncelleme dosyaları üretilemedi.' }
          gh release upload $env:KOC_RELEASE_TAG "kopru/koc-market-tauri-setup-$v.exe" "kopru/latest.yml" --clobber
