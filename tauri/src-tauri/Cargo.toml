[package]
name = "koc-market"
version = "2.0.2"
description = "Koç Market - Satış Sistemi (Tauri masaüstü uygulaması)"
authors = ["Koç Market"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "koc_market_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
chrono = "0.4"
tokio = { version = "1", features = ["time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "unwind"
strip = true
